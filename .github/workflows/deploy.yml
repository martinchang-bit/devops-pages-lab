name: Deploy GitHub Pages with Smoke Test
on:
  push:
    branches: [main]          # 只有 main 才部署
  workflow_dispatch:
    inputs:
      simulate_stale:
        description: "Demo: deploy a stale version.txt"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Write version.txt
        run: |
          if [ "${{ inputs.simulate_stale }}" = "true" ]; then
            echo "STALE-OLD-VERSION" > version.txt
          else
            echo "${{ github.sha }}" > version.txt
          fi
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live version
        run: |
          EXPECTED="${{ github.sha }}"
          URL="https://martinchang-bit.github.io/devops-pages-lab/version.txt"
          for i in 1 2 3 4 5 6; do
            ACTUAL=$(curl -s -H "Cache-Control: no-cache" "$URL?cb=$(date +%s)" | tr -d '[:space:]')
            echo "attempt $i | expected=$EXPECTED | actual=$ACTUAL"
            if [ "$ACTUAL" = "$EXPECTED" ]; then echo "OK: live version matches"; exit 0; fi
            sleep 10
          done
          echo "::error::Version mismatch: expected $EXPECTED, live serves $ACTUAL"
          exit 1
