name: Deploy GitHub Pages with Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject Version File
        run: |
          echo "${{ github.sha }}" > version.txt

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for CDN Invalidation
        run: sleep 15

      - name: Verify Live Version Matching
        run: |
          EXPECTED_SHA="${{ github.sha }}"
          SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/version.txt"
          
          echo "Fetching version from: $SITE_URL"
          FETCHED_SHA=$(curl -sSL -H "Cache-Control: no-cache" "$SITE_URL" | tr -d '\r\n ')
          
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Fetched SHA : $FETCHED_SHA"
          
          if [ "$FETCHED_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ Smoke Test Failed: Live site version does not match deployed SHA!"
            exit 1
          fi
          echo "✅ Smoke Test Passed: Live site serves expected SHA."
